spring.application.name=telemetry
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS\:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
app.kafka.telemetry-topic=telemetry.events
app.alerts.evaluation-interval-ms=30000
app.ai.base-url=${GROQ_BASE_URL:${OPENAI_BASE_URL:https://api.groq.com/openai/v1}}
app.ai.model=${GROQ_MODEL:${OPENAI_MODEL:openai/gpt-oss-20b}}
app.ai.history.max-results=${AI_HISTORY_MAX_RESULTS:100}
app.ai.groq.circuit-breaker.sliding-window-size=${AI_GROQ_CB_SLIDING_WINDOW_SIZE:10}
app.ai.groq.circuit-breaker.minimum-number-of-calls=${AI_GROQ_CB_MINIMUM_NUMBER_OF_CALLS:5}
app.ai.groq.circuit-breaker.failure-rate-threshold=${AI_GROQ_CB_FAILURE_RATE_THRESHOLD:50}
app.ai.groq.circuit-breaker.wait-duration-in-open-state-seconds=${AI_GROQ_CB_WAIT_DURATION_IN_OPEN_STATE_SECONDS:15}
app.ai.groq.circuit-breaker.permitted-number-of-calls-in-half-open-state=${AI_GROQ_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:2}
app.ai.groq.circuit-breaker.automatic-transition-from-open-to-half-open-enabled=${AI_GROQ_CB_AUTOMATIC_TRANSITION:false}
spring.kafka.consumer.group-id=fleet-telemetry-persistence
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.fleet.telemetry.infrastructure.adapter.out.kafka.TelemetryEventMessage
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.fleet.telemetry.infrastructure.adapter.out.kafka
spring.kafka.listener.ack-mode=record
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleet}
spring.datasource.username=${POSTGRES_USER:fleet}
spring.datasource.password=${POSTGRES_PASSWORD:local_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
